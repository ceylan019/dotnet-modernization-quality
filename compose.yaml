# Compose interpolates the whole file whatever the profile, so every command needs both
# MSSQL_SA_PASSWORD and POSTGRES_PASSWORD: from .env locally, while the pipeline sets a real
# POSTGRES_PASSWORD and a throwaway MSSQL_SA_PASSWORD (it starts no legacy service).
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    profiles: [legacy-db, legacy-preview]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (copy .env.example)}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # Local Mono preview of the legacy app: a test aid only, see
  # docs/decisions/0006-legacy-runs-on-windows-runners.md. Build the solution first.
  # No platform pin: the amd64 Mono image crashes under emulation on Apple Silicon.
  legacy-preview:
    build: tools/mono-preview
    profiles: [legacy-preview]
    environment:
      PERMITS_DB: Data Source=mssql,1433;Initial Catalog=Permits;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (copy .env.example)}
      FIXED_TODAY: ${FIXED_TODAY:-2026-10-15}
    volumes:
      - ./legacy/src/Permits.Web:/src:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 24
    depends_on:
      mssql:
        condition: service_healthy

  # The modern stack has its own profile so legacy commands such as
  # `docker compose --profile legacy-db up -d mssql` never start it. Naming the
  # services explicitly (`docker compose up -d app postgres`) enables them.
  postgres:
    image: postgres:17
    profiles: [modern]
    environment:
      POSTGRES_DB: permits
      POSTGRES_USER: permits
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permits -d permits"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${APP_IMAGE:-permits-modern:local}
    build: ./modern
    profiles: [modern]
    environment:
      ConnectionStrings__PermitsDb: Host=postgres;Port=5432;Database=permits;Username=permits;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      App__FixedToday: "2026-10-15"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
